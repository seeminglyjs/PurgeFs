[package]
name = "purgefs"
version = "0.1.0"
edition = "2021"
description = "Fast terminal disk cleaner for macOS/Linux — scan and purge junk files and directories, no GUI, no paywall."
license = "MIT"
repository = "https://github.com/seeminglyjs/PurgeFs"
readme = "README.md"
keywords = ["cli", "disk", "cleaner", "filesystem", "tui"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "purgefs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
